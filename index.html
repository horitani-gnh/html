<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>授業用HTML教材</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;background:#f3f6fa;color:#18263a}*{box-sizing:border-box}body{margin:0}header{background:#173653;color:white;padding:28px 18px}header>div,main{max-width:1000px;margin:auto}h1{margin:0 0 6px;font-size:clamp(24px,4vw,34px)}header p{margin:0;color:#d9e6f0}main{padding:24px 16px 64px}.toolbar{display:flex;gap:10px;margin-bottom:20px}input{min-width:0;flex:1;font:inherit;border:1px solid #c9d4df;border-radius:10px;padding:12px 14px}button{font:inherit;border:1px solid #b7c8d7;background:white;border-radius:10px;padding:10px 16px;cursor:pointer}button:hover{background:#eaf2f9}section{background:white;border:1px solid #dce5ed;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 3px 12px #20364b09}h2{font-size:22px;margin:0 0 14px;display:flex;align-items:center;gap:10px}.count{font-size:13px;color:#526479;background:#eef3f8;padding:4px 9px;border-radius:99px}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.item{display:block;text-decoration:none;color:#183c62;background:#f5f9fc;border:1px solid #d8e4ed;border-radius:11px;padding:16px;overflow-wrap:anywhere;font-weight:650}.item:hover{background:#e8f2fc;border-color:#8fb4d3}.empty{color:#6a7785;font-size:14px;margin:0}.status{color:#5e6e80;margin:0 0 15px;font-size:14px}.error{color:#a12323}footer{font-size:12px;color:#6b7a89;text-align:center;margin-top:25px}@media(max-width:500px){section{padding:16px}.toolbar{flex-wrap:wrap}.toolbar button{flex:0 0 auto}}
</style>
</head>
<body>
<header><div><h1>授業用HTML教材</h1><p>科目を選んで教材を開いてください</p></div></header>
<main>
<div class="toolbar"><input id="search" type="search" placeholder="教材名で検索" aria-label="教材名で検索"><button id="reload" type="button">一覧を更新</button></div>
<p id="status" class="status" role="status">教材を読み込んでいます…</p>
<div id="sections"></div>
<footer>教材はGitHubのフォルダから自動取得しています。</footer>
</main>
<script>
'use strict';
const OWNER='horitani-gnh',REPO='html',BRANCH='main';
const PAGE_BASE=`https://${OWNER}.github.io/${REPO}/`;
const API_BASE=`https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
const subjects=[
 {name:'生物基礎',folder:'biology',legacy:['セントラルドグマ_授業用.html']},
 {name:'地学基礎',folder:'earth',legacy:[]}
];
let allGroups=[];
const $=id=>document.getElementById(id);
function isLesson(item){return item&&item.type==='file'&&/\.html?$/i.test(item.name)&&item.name.toLowerCase()!=='index.html';}
function displayName(name){return name.replace(/\.html?$/i,'').replace(/[_＿]/g,' ');}
function pageUrl(path){return PAGE_BASE+path.split('/').map(encodeURIComponent).join('/');}
async function listFolder(folder){
 const url=API_BASE+(folder?folder+'/':'')+'?ref='+encodeURIComponent(BRANCH);
 const response=await fetch(url,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
 if(!response.ok)throw new Error(`${folder||'ルート'}: HTTP ${response.status}`);
 const data=await response.json();
 if(!Array.isArray(data))throw new Error('ファイル一覧を取得できませんでした');
 return data;
}
async function load(){
 $('reload').disabled=true;$('status').textContent='教材を読み込んでいます…';$('status').className='status';
 try{
  const root=await listFolder('');
  const existingFolders=new Set(root.filter(x=>x.type==='dir').map(x=>x.name));
  const rootFiles=root.filter(isLesson);
  const results=await Promise.all(subjects.map(async s=>{
   let entries=[];
   if(existingFolders.has(s.folder))entries=(await listFolder(s.folder)).filter(isLesson).map(x=>({name:x.name,path:s.folder+'/'+x.name}));
   const existing=new Set(entries.map(x=>x.path));
   for(const file of s.legacy){if(rootFiles.some(x=>x.name===file)&&!existing.has(file))entries.unshift({name:file,path:file});}
   return {name:s.name,items:entries.sort((a,b)=>a.name.localeCompare(b.name,'ja'))};
  }));
  const assigned=new Set(results.flatMap(g=>g.items.map(x=>x.path)));
  const uncategorized=rootFiles.filter(x=>!assigned.has(x.name)).map(x=>({name:x.name,path:x.name}));
  if(uncategorized.length)results.push({name:'未分類（ルート直下）',items:uncategorized});
  allGroups=results;render();$('status').textContent='教材一覧を更新しました。';
 }catch(err){$('status').textContent='一覧を取得できませんでした。通信状態を確認し、「一覧を更新」を押してください。 '+err.message;$('status').className='status error';}
 finally{$('reload').disabled=false;}
}
function render(){
 const query=$('search').value.trim().toLocaleLowerCase();
 const container=$('sections');container.replaceChildren();
 for(const group of allGroups){
  const section=document.createElement('section');
  const heading=document.createElement('h2');heading.textContent=group.name;
  const filtered=group.items.filter(x=>displayName(x.name).toLocaleLowerCase().includes(query));
  const count=document.createElement('span');count.className='count';count.textContent=filtered.length+'件';heading.append(count);section.append(heading);
  if(filtered.length){const grid=document.createElement('div');grid.className='items';for(const item of filtered){const link=document.createElement('a');link.className='item';link.href=pageUrl(item.path);link.textContent=displayName(item.name);grid.append(link);}section.append(grid);}
  else{const p=document.createElement('p');p.className='empty';p.textContent=query?'一致する教材はありません。':'教材はまだありません。';section.append(p);}
  container.append(section);
 }
}
$('search').addEventListener('input',render);
$('reload').addEventListener('click',load);
load();
</script>
</body>
</html>
