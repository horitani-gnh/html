<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="明るい校庭で走る人を通して、感覚神経・運動神経・交感神経・副交感神経の働きを同時に見る電子黒板用教材。">
<title>神経のはたらき</title>
<style>
:root{--paper:#f6f7f1;--ink:#253c39;--muted:#6b7c75;--line:#d8e1d6;--sensory:#166dc0;--motor:#c56c12;--sympathetic:#a74480;--parasympathetic:#198366;--green:#255a49;font-family:"BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);background:var(--paper);font-synthesis:none}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;cursor:pointer;color:inherit}button:focus-visible{outline:4px solid #206fbd;outline-offset:4px}button svg{width:1.12em;height:1.12em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}button:active{transform:translateY(1px)}button:hover{filter:brightness(.975)}
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:clamp(12px,1.5vh,34px) clamp(16px,1.8vw,70px);gap:clamp(10px,1.2vh,26px);max-width:100vw}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:clamp(16px,2vw,76px);min-height:clamp(86px,10.4vh,224px)}h1{margin:0;font-size:clamp(25px,2.1vw,78px);letter-spacing:.04em;font-weight:750;white-space:nowrap}.systems{display:flex;gap:clamp(20px,2.1vw,80px)}.system{display:flex;flex-direction:column;gap:clamp(6px,.8vh,16px)}.system-name{font-weight:700;color:#617369;font-size:clamp(16px,1.15vw,44px);padding-left:8px;letter-spacing:.08em}.nerve-buttons{display:flex;gap:clamp(8px,.7vw,26px)}.nerve{--c:var(--sensory);display:flex;align-items:center;gap:clamp(8px,.6vw,22px);border:1.5px solid color-mix(in srgb,var(--c) 28%,#e2e8df);background:#fffefa;border-radius:clamp(10px,.75vw,28px);padding:clamp(8px,1vh,24px) clamp(10px,1vw,38px);min-height:clamp(52px,6vh,130px);font-size:clamp(20px,1.45vw,56px);font-weight:700;white-space:nowrap;transition:background .15s,border-color .15s}.nerve i{height:.48em;width:.48em;flex:none;border-radius:50%;background:var(--c)}.nerve svg{color:var(--c);height:1em;width:1em}.nerve[aria-pressed=false]{border-style:dashed;background:transparent;color:#7c8680}.nerve[aria-pressed=false] i{background:transparent;border:2px solid var(--c)}.nerve[aria-pressed=false] svg{opacity:.3}.motor{--c:var(--motor)}.sympathetic{--c:var(--sympathetic)}.parasympathetic{--c:var(--parasympathetic)}
.stage{min-height:0;position:relative;border:1px solid #d5dfd2;border-radius:clamp(16px,1.4vw,52px);overflow:hidden;background:#f3f7ef}.stage canvas{width:100%;height:100%;display:block}.fatal{position:absolute;inset:0;align-content:center;text-align:center;background:#fff9ed;font-size:28px}.fatal[hidden]{display:none}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:clamp(68px,8.2vh,178px)}.transport,.display-controls{display:flex;align-items:center;gap:clamp(10px,.8vw,30px)}.toolbar button{display:inline-flex;align-items:center;justify-content:center;gap:clamp(10px,.7vw,26px);min-height:clamp(56px,6.8vh,146px);padding:clamp(9px,1vh,22px) clamp(17px,1.4vw,54px);font-size:clamp(20px,1.4vw,54px);font-weight:700;border:1px solid #cdd9cd;border-radius:clamp(12px,.8vw,30px);background:#fffefa;white-space:nowrap}.toolbar .play{background:var(--green);color:white;border-color:var(--green);min-width:clamp(142px,11vw,422px);font-weight:750}.play svg{fill:currentColor;stroke:none}.toolbar .toggle,.toolbar .quiet{background:transparent;border-color:transparent;padding-left:clamp(8px,.7vw,28px);padding-right:clamp(8px,.7vw,28px)}.toolbar .quiet{color:#66786d;font-size:clamp(18px,1.2vw,46px)}.switch{width:1.55em;height:.88em;background:#d4dcd3;display:inline-block;position:relative;border-radius:1em;flex:none;transition:background .15s}.switch:after{content:"";position:absolute;width:.64em;height:.64em;top:.12em;left:.12em;border-radius:50%;background:white;box-shadow:0 1px 3px #1f42332b;transition:transform .15s}.toggle[aria-pressed=true] .switch{background:var(--green)}.toggle[aria-pressed=true] .switch:after{transform:translateX(.66em)}.toggle[aria-pressed=mixed] .switch{background:#889e8a}.toggle[aria-pressed=mixed] .switch:after{transform:translateX(.33em)}.hide-names .nerve-name,.hide-names .system-name{visibility:hidden}
@media(max-width:1200px){.app{padding:12px 16px;gap:10px}.topbar{gap:14px}.systems{gap:16px}.system-name{font-size:16px}.nerve{font-size:19px;gap:7px;padding:8px 10px;min-height:52px}.nerve-buttons{gap:7px}h1{font-size:25px}.toolbar button{font-size:20px;padding:10px 16px}.toolbar .quiet{font-size:18px}.toolbar .toggle{padding:8px}.transport,.display-controls{gap:8px}}
@media(max-width:900px){.topbar{align-items:flex-start;gap:10px}h1{font-size:21px;padding-top:30px}.systems{gap:12px}.nerve-buttons{gap:6px}.nerve{font-size:16px;padding:8px;min-height:48px;gap:5px}.nerve svg{display:none}.system-name{font-size:14px}.toolbar{gap:8px}.toolbar button{font-size:16px;min-height:50px;padding:8px 10px}.toolbar .play{min-width:110px}.toolbar .quiet{font-size:15px}.transport,.display-controls{gap:4px}}
@media(max-width:620px) and (orientation:portrait){.app{padding:10px;gap:8px}.topbar{flex-direction:column;min-height:124px;gap:8px}h1{padding:0;font-size:22px}.systems{width:100%;justify-content:space-between;gap:8px}.system{gap:5px}.nerve{font-size:13px;min-height:44px;padding:6px;gap:4px}.system-name{font-size:13px}.toolbar{flex-wrap:wrap;justify-content:center;gap:8px}.toolbar button{min-height:46px}.display-controls{justify-content:center}.toolbar .toggle{padding:5px 8px}.stage{border-radius:14px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <h1>神経のはたらき</h1>
    <div class="systems" aria-label="神経の分類と経路の表示">
      <section class="system" aria-label="体性神経系">
        <span class="system-name">体性神経系</span>
        <div class="nerve-buttons">
          <button type="button" class="nerve sensory" data-nerve="sensory" aria-label="感覚神経の経路" aria-pressed="true"><i aria-hidden="true"></i><span class="nerve-name">感覚神経</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
          <button type="button" class="nerve motor" data-nerve="motor" aria-label="運動神経の経路" aria-pressed="true"><i aria-hidden="true"></i><span class="nerve-name">運動神経</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
        </div>
      </section>
      <section class="system" aria-label="自律神経系">
        <span class="system-name">自律神経系</span>
        <div class="nerve-buttons">
          <button type="button" class="nerve sympathetic" data-nerve="sympathetic" aria-label="交感神経の経路" aria-pressed="true"><i aria-hidden="true"></i><span class="nerve-name">交感神経</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
          <button type="button" class="nerve parasympathetic" data-nerve="parasympathetic" aria-label="副交感神経の経路" aria-pressed="true"><i aria-hidden="true"></i><span class="nerve-name">副交感神経</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
        </div>
      </section>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="scene" role="img" aria-label="明るい校庭でボールを目で追いながら走る人。目から脳へ伝わる感覚の情報、脳と脊髄から脚の骨格筋への指令、心臓の拍動を速める交感神経、瞳孔を小さくする副交感神経を同時に示す模式図。右に瞳孔と心臓の拡大図。"></canvas>
    <div class="fatal" id="fatal" hidden>表示できませんでした。再読み込みしてください。</div>
  </main>
  <footer class="toolbar" aria-label="教材の操作">
    <div class="transport">
      <button type="button" id="play" class="play" aria-pressed="false"><svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4 12 8-12 8Z"/></svg><span id="play-label">再生</span></button>
      <button type="button" id="reset"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9A8 8 0 1 1 4 15M4 3v6h6"/></svg><span>最初から</span></button>
    </div>
    <div class="display-controls">
      <button type="button" id="names" class="toggle" aria-pressed="true"><span class="switch" aria-hidden="true"></span><span>名称</span></button>
      <button type="button" id="paths" class="toggle" aria-pressed="true"><span class="switch" aria-hidden="true"></span><span>経路</span></button>
      <button type="button" id="show-all" class="quiet">全表示</button>
      <button type="button" id="fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5m6 0h5v5m0 6v5h-5M9 20H4v-5"/></svg><span>全画面</span></button>
    </div>
  </footer>
</div>
<!--
  教員向け記録（教材画面には表示しない）
  経路・大きさ・時間は模式的。視覚と対光反射の中枢内経路、神経節等は省略。
  教科書の分類に従って「体性：感覚・運動／自律：交感・副交感」を表示。
  心臓は自ら拍動し、神経が拍動の速さ等を調節する。神経の印と心拍は別周期。
  瞳孔は一定の明るい環境で小さい状態を維持。虹彩に入る副交感神経を示す。
  今回の代表的作用を示すもので、心臓に交感神経しかない等を意味しない。
  実際の心拍や瞳孔径には複数の神経・要因が関与する。
  参考： https://www.nhlbi.nih.gov/health/heart/heart-beats
         https://www.ncbi.nlm.nih.gov/books/NBK537180/
         https://www.ncbi.nlm.nih.gov/books/NBK459238/
-->
<script>
(()=>{
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d'),app=document.getElementById('app');
const C={ink:'#2d4540',muted:'#73877a',sensory:'#166dc0',motor:'#c56c12',sympathetic:'#a74480',parasympathetic:'#198366',skin:'#e6b18d',skinLine:'#b57b5f'};
const keys=['sensory','motor','sympathetic','parasympathetic'];
const state={t:0,playing:false,names:true,paths:{sensory:true,motor:true,sympathetic:true,parasympathetic:true}};
const TAU=Math.PI*2,W=1600,H=770;
let last=0,raf=0,view={s:1,x:0,y:0,w:W,h:H};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const mix=(a,b,t)=>a+(b-a)*t;
const pt=(x,y)=>({x,y});
const blend=(a,b,t)=>pt(mix(a.x,b.x,t),mix(a.y,b.y,t));

function path(d,fill,stroke,width=1){const p=new Path2D(d);if(fill){ctx.fillStyle=fill;ctx.fill(p);}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke(p);}}
function ellipse(x,y,rx,ry,fill,stroke,width=1,rot=0){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot,0,TAU);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}}
function line(points,stroke,width=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}
function round(x,y,w,h,r,fill,stroke,width=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}}
function text(s,x,y,size=28,color=C.ink,weight=600,align='left'){ctx.fillStyle=color;ctx.font=weight+' '+size+'px "BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif';ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function label(s,x,y,anchor){if(!state.names)return;const width=ctx.measureText(s).width;ctx.save();ctx.font='600 27px "Yu Gothic UI","Meiryo",sans-serif';const w=ctx.measureText(s).width;round(x-12,y-20,w+24,40,10,'#f9fbf3e8');text(s,x,y,27,C.ink,650);if(anchor){line([pt(x+w+16,y),pt(anchor.x-13,anchor.y)],'#a3b2a0',1.6);ellipse(anchor.x,anchor.y,3.5,3.5,'#879b88');}ctx.restore();}

function cubic(a,b,c,d,n=40){let out=[];for(let i=0;i<=n;i++){let t=i/n,s=1-t;out.push(pt(s*s*s*a.x+3*s*s*t*b.x+3*s*t*t*c.x+t*t*t*d.x,s*s*s*a.y+3*s*s*t*b.y+3*s*t*t*c.y+t*t*t*d.y));}return out;}
function through(segs){let p=[];for(const s of segs)p=p.concat(cubic(...s).slice(p.length?1:0));return p;}
function sample(points,f){let lengths=[],total=0;for(let i=1;i<points.length;i++){total+=Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y);lengths.push(total);}const target=clamp(f,0,1)*total;let i=lengths.findIndex(v=>v>=target);if(i<0)i=lengths.length-1;const prev=i?lengths[i-1]:0;return blend(points[i],points[i+1],(target-prev)/(lengths[i]-prev||1));}
function arrow(points,f,color,size=10){const a=sample(points,Math.max(0,f-.025)),b=sample(points,f),ang=Math.atan2(b.y-a.y,b.x-a.x);ctx.save();ctx.translate(b.x,b.y);ctx.rotate(ang);path('M '+(-size)+' '+(-size*.58)+' L 0 0 L '+(-size)+' '+(size*.58),null,'#fffdf7',5.7);path('M '+(-size)+' '+(-size*.58)+' L 0 0 L '+(-size)+' '+(size*.58),null,color,3.2);ctx.restore();}
function nerve(points,key,t,options={}){
 if(!state.paths[key])return;
 const color=C[key];ctx.save();ctx.globalAlpha=.16;line(points,color,13);ctx.globalAlpha=1;line(points,'#fffcf5',7.5);line(points,color,3.8);
 for(const f of (options.arrows||[.34,.7,.97]))arrow(points,f,color,options.size||11);
 const speed={sensory:.39,motor:.28,sympathetic:.215,parasympathetic:.31}[key];
 for(let i=0;i<(options.dots||3);i++){const f=(t*speed+i/(options.dots||3)+.07)%1,p=sample(points,f);ellipse(p.x,p.y,5.1,5.1,'#fffdf8',color,2.4);}
 ctx.restore();
}

function sun(x,y,r=29){ellipse(x,y,r,r,'#f1c360');ctx.save();ctx.strokeStyle='#edca7e';ctx.lineWidth=3;for(let i=0;i<8;i++){const a=i*TAU/8;line([pt(x+Math.cos(a)*(r+10),y+Math.sin(a)*(r+10)),pt(x+Math.cos(a)*(r+22),y+Math.sin(a)*(r+22))],'#edca7e',3);}ctx.restore();}
function background(){
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#eef6ef');sky.addColorStop(.65,'#f6f8eb');sky.addColorStop(1,'#eeeedd');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 // Distant schoolyard, kept low in contrast so the anatomy remains dominant.
 sun(120,102,30);
 path('M 20 405 Q 240 360 455 396 T 1076 389 L 1100 610 L 20 610 Z','#e3ecd7');
 round(52,287,305,182,6,'#e2e8db');round(41,275,328,18,4,'#cbd7c6');
 for(let row=0;row<3;row++)for(let col=0;col<6;col++)round(76+col*44,310+row*46,25,27,2,'#c1d2c8');
 line([pt(52,453),pt(357,453)],'#c6d2c1',4);
 for(const x of [905,1010]){line([pt(x,382),pt(x,499)],'#bfccb3',11);ellipse(x,356,x===905?54:65,65,'#d7e4cd');ellipse(x-23,335,37,45,'#dce8d0');}
 path('M 0 485 Q 240 466 458 485 T 1110 477 L 1110 770 L 0 770Z','#ece8d5');
 line([pt(0,683),pt(1096,683)],'#d0cdb7',3);
 path('M 18 745 Q 420 665 1057 718',null,'#fffdf0',4);
 ctx.save();ctx.globalAlpha=.6;line([pt(45,522),pt(230,516)],'#d5d4bc',2);line([pt(808,533),pt(1082,536)],'#d5d4bc',2);ctx.restore();
 // The right panel belongs to the same scene, but its quiet backdrop improves projection contrast.
 round(1106,17,477,734,26,'#edf2e8');
}

function pose(t){
 const phase=t*.88,cycle=phase*TAU,bounce=-Math.cos(cycle*2)*7;
 const hip=pt(514,449+bounce),shoulder=pt(581,292+bounce),head=pt(631,184+bounce);
 function leg(offset){const u=(phase+offset)%1;let v,x,y;if(u<.56){v=u/.56;x=mix(659,401,v);y=664;}else{v=(u-.56)/.44;x=mix(401,659,v);y=664-Math.sin(Math.PI*v)*143;}
  const origin=pt(hip.x+(offset? -6:7),hip.y+8),ankle=pt(x,y),dx=ankle.x-origin.x,dy=ankle.y-origin.y,d=Math.hypot(dx,dy),a=150,b=159;
  const along=(a*a-b*b+d*d)/(2*d),h=Math.sqrt(Math.max(0,a*a-along*along)),knee=pt(origin.x+dx/d*along+dy/d*h,origin.y+dy/d*along-dx/d*h);
  return {hip:origin,knee,ankle,u,footAngle:u<.56?(u>.42?-.14:0):-.25+.5*Math.sin(v*Math.PI)};
 }
 function arm(offset){const s=pt(shoulder.x+(offset?-24:10),shoulder.y+(offset?7:7)),q=Math.sin(cycle+offset*Math.PI*2);return {s,elbow:pt(s.x+q*67-21,s.y+107-Math.abs(q)*12),hand:pt(s.x+q*67+75,s.y+48-Math.abs(q)*12)};}
 return {hip,shoulder,head,bounce,front:leg(0),back:leg(.5),frontArm:arm(.5),backArm:arm(0),eye:pt(663,191+bounce),brain:pt(628,170+bounce),stem:pt(605,211+bounce),heart:pt(596,335+bounce)};
}
function limb(a,b,c,width,fill,outline){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';line([a,b,c],outline,width+3);line([a,b,c],fill,width);ctx.restore();}
function shoe(leg,dark=false){ctx.save();ctx.translate(leg.ankle.x,leg.ankle.y);ctx.rotate(leg.footAngle);path('M -16 -12 Q -1 -16 9 -5 L 45 1 Q 52 6 49 14 L -20 14 Q -24 9 -16 -12 Z',dark?'#506966':'#f8fcf5',dark?'#405b56':'#58756a',2.5);line([pt(-20,10),pt(48,10)],dark?'#c9d8ce':'#b3c9bc',4);path('M 5 -5 L 24 2 M 0 -2 L 17 5',null,dark?'#afc2b5':'#8eab9d',2);ctx.restore();}
function runner(p,t){
 const b=p.bounce;
 ellipse(527,692,177,18,'#b8b8a532');
 limb(p.back.hip,p.back.knee,p.back.ankle,42,'#cc9779','#b9856c');shoe(p.back,true);
 limb(p.backArm.s,p.backArm.elbow,p.backArm.hand,32,'#d5a181','#bb8568');ellipse(p.backArm.hand.x+3,p.backArm.hand.y-2,17,18,'#d5a181');
 // Neck, sports vest, shorts, then foreground limbs.
 path(`M 613 ${230+b} L 598 ${279+b} L 625 ${300+b} L 646 ${243+b} Z`,C.skin,C.skinLine,2.2);
 const vest=ctx.createLinearGradient(470,300,625,447);vest.addColorStop(0,'#fafdf3');vest.addColorStop(1,'#d7e8cd');
 path(`M 553 ${278+b} Q 574 ${271+b} 605 ${286+b} Q 626 ${300+b} 630 ${323+b} L 567 ${438+b} Q 549 ${462+b} 510 ${466+b} L 460 ${444+b} Q 486 ${385+b} 511 ${330+b} Q 526 ${294+b} 553 ${278+b} Z`,vest,'#7c9884',2.5);
 path(`M 554 ${281+b} Q 571 ${311+b} 604 ${290+b}`,null,'#9cb49c',7);
 path(`M 465 ${432+b} Q 520 ${453+b} 566 ${428+b} L 569 ${476+b} L 520 ${492+b} L 492 ${474+b} L 463 ${487+b} L 445 ${467+b} Z`,'#3c5b58','#2b4947',2.5);
 path(`M 465 ${445+b} Q 511 ${463+b} 558 ${443+b}`,null,'#749284',3);
 limb(p.front.hip,p.front.knee,p.front.ankle,45,'#e5b28f','#bd896d');shoe(p.front);
 // Muscle silhouettes support the target of the motor pathway.
 const thighA=blend(p.front.hip,p.front.knee,.18),thighB=blend(p.front.hip,p.front.knee,.77),calfA=blend(p.front.knee,p.front.ankle,.2),calfB=blend(p.front.knee,p.front.ankle,.69);
 ctx.save();ctx.lineCap='round';line([thighA,thighB],'#bc6c5d55',25);line([calfA,calfB],'#bc6c5d44',20);ctx.restore();
 limb(p.frontArm.s,p.frontArm.elbow,p.frontArm.hand,34,'#edbd99','#c18c70');ellipse(p.frontArm.hand.x+3,p.frontArm.hand.y-1,18,18,'#edbd99',C.skinLine,1.6);
 // Side profile, ear, hair and eye.

function draw(){
 const {s,x,y,w,h}=view;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#f0f4e9';ctx.fillRect(0,0,canvas.width,canvas.height);

function safeDraw(){try{draw();}catch(e){document.getElementById('fatal').hidden=false;state.playing=false;cancelAnimationFrame(raf);console.error(e);}}
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);if(r.width<1||r.height<1)return;canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);const s=Math.min(r.width/W,r.height/H);view={s,x:(r.width-W*s)/2,y:(r.height-H*s)/2,w:r.width,h:r.height};safeDraw();}
function loop(now){raf=0;if(!state.playing)return;const delta=last?Math.min((now-last)/1000,.06):0;last=now;state.t+=delta;safeDraw();if(state.playing)raf=requestAnimationFrame(loop);}
function sync(){

 const play=document.getElementById('play');play.setAttribute('aria-pressed',String(state.playing));document.getElementById('play-label').textContent=state.playing?'一時停止':'再生';document.getElementById('play-icon').innerHTML=state.playing?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="m8 4 12 8-12 8Z"/>';

}
function playPause(){state.playing=!state.playing;last=0;if(state.playing&&!raf)raf=requestAnimationFrame(loop);else if(!state.playing){cancelAnimationFrame(raf);raf=0;}sync();safeDraw();}
function reset(){state.t=0;state.playing=false;last=0;cancelAnimationFrame(raf);raf=0;sync();safeDraw();}
function setPaths(){const all=keys.every(k=>state.paths[k]);keys.forEach(k=>state.paths[k]=!all);sync();safeDraw();}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await app.requestFullscreen();}catch(e){console.warn('Fullscreen unavailable',e.name);}}
document.getElementById('play').addEventListener('click',playPause);
document.getElementById('reset').addEventListener('click',reset);

document.querySelectorAll('[data-nerve]').forEach(b=>b.addEventListener('click',()=>{state.paths[b.dataset.nerve]=!state.paths[b.dataset.nerve];sync();safeDraw();}));
